name: Comfy CI/CD
on:
  push:
    branches:
      - master
      - gitea_workflow
    tags:
      - 'v*'

env:
  GITEA_URL: gitea.cymbaldev.local

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run Tests
        run: make test
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: run-tests
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Login to Gitea Docker Registry
        uses: docker/login-action@v2
        with:
          registry: https://gitea.cymbaldev.local
          username: cybot
          password: ${{ secrets.PAT_TOKEN }}
      - name: Build and push
        run: |
          docker build -f prod.dockerfile -t ${{ GITEA_URL }}/${{ github.repository }}:${{ github.ref_name }} .
          docker push ${{ GITEA_URL }}/${{ github.repository }}:${{ github.ref_name }}
