name: Comfy CI/CD
on:
  push:
    branches:
      - master

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run Tests
        run: make test
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Login to Gitea Docker Registry
        uses: docker/login-action@v2
        with:
          registry: http://192.168.50.199:3000
          username: cybot
          password: ${{ secrets.PAT_TOKEN }}
      - name: Build and push
        run:
          docker build -f prod.dockerfile -t 192.168.50.199:3000/cymbaldev/comfy:v1.0.0 .
          docker push 192.168.50.199:3000/cymbaldev/comfy:v1.0.0
